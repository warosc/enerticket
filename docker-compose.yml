services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: servicedesk
      POSTGRES_USER: servicedesk
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-local}
    volumes: [db_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U servicedesk -d servicedesk"]
      interval: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-change-me-local}
    volumes: [kc_data:/var/lib/postgresql/data]
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-change-me-local}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-change-me-local}
    ports: ["8081:8080"]
    depends_on: [keycloak-db]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://servicedesk:${DB_PASSWORD:-change-me-local}@db:5432/servicedesk
      REDIS_URL: redis://redis:6379/0
      AUTH_MODE: ${AUTH_MODE:-dev}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8081/realms/energuate}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-servicedesk-api}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
  worker:
    build: ./backend
    command: celery -A app.tasks.celery_app worker --loglevel=info
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on: [redis]
  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  db_data:
  redis_data:
  kc_data:

# Energuate Service Desk — Fase 2
#
# Uso:  cp .env.example .env   (editar TODOS los valores replace-...)
#       docker compose up -d --build
#
# Todos los puertos se publican solo en 127.0.0.1. Los secretos llegan desde .env
# (nunca desde este archivo); las variables marcadas con ":?" son obligatorias.

name: energuate-service-desk

x-common: &common
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

# Entorno compartido por api, worker y beat (misma imagen del backend).
x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://servicedesk:${DB_PASSWORD:?Defina DB_PASSWORD en .env}@db:5432/servicedesk
  REDIS_URL: redis://redis:6379/0
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  AUTH_MODE: ${AUTH_MODE:-oidc}
  OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8081/realms/energuate}
  OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/energuate/protocol/openid-connect/certs}
  OIDC_AUDIENCE: ${OIDC_AUDIENCE:-servicedesk-api}
  SEED_DEMO: ${SEED_DEMO:-false}
  SEED_TEAM_GROUPS: ${SEED_TEAM_GROUPS:-Telecomunicaciones:GG-SD-Telecomunicaciones,Seguridad de Redes:GG-SD-SeguridadRedes,Ciberseguridad / SOC:GG-SD-SOC,Riesgo y Cumplimiento:GG-SD-Riesgo,Proyectos TI:GG-SD-ProyectosTI,General:GG-SD-General}
  TZ_BUSINESS: ${TZ_BUSINESS:-America/Guatemala}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Defina S3_ACCESS_KEY en .env}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?Defina S3_SECRET_KEY en .env}
  S3_BUCKET: ${S3_BUCKET:-servicedesk-attachments}
  S3_REGION: ${S3_REGION:-us-east-1}
  MAX_ATTACHMENT_MB: ${MAX_ATTACHMENT_MB:-20}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-servicedesk@localhost}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}

services:
  # --- Datos de la aplicación -------------------------------------------------
  db:
    <<: *common
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: servicedesk
      POSTGRES_USER: servicedesk
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
    volumes: [db_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicedesk -d servicedesk"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    <<: *common
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- Identidad (Keycloak + federación AD) -----------------------------------
  keycloak-db:
    <<: *common
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?Defina KC_DB_PASSWORD en .env}
    volumes: [kc_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    <<: *common
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.1}
    # start-dev: HTTP sin TLS, solo para laboratorio local. Producción: "start"
    # con TLS/proxy inverso (ver README, sección Advertencias).
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?Defina KC_DB_PASSWORD en .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?Defina KC_ADMIN_PASSWORD en .env}
      # URL pública: determina el "iss" de los tokens (= OIDC_ISSUER de la API).
      KC_HOSTNAME: ${KC_HOSTNAME:-http://localhost:8081}
      KC_HEALTH_ENABLED: "true"
      # CA corporativa para LDAPS/StartTLS contra el AD (archivos .pem/.crt/.p12).
      KC_TRUSTSTORE_PATHS: /opt/keycloak/conf/truststores
      KC_LOG_LEVEL: ${KC_LOG_LEVEL:-info}
    volumes:
      - ./keycloak/realm-energuate.json:/opt/keycloak/data/import/realm-energuate.json:ro
      - ./keycloak/truststore:/opt/keycloak/conf/truststores:ro
    ports: ["127.0.0.1:8081:8080"]
    depends_on:
      keycloak-db: {condition: service_healthy}
    healthcheck:
      # La imagen no trae curl: se consulta /health/ready en el puerto de gestión 9000 (interno).
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  keycloak-config:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.1}
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/bin/sh", "/opt/keycloak/scripts/configure-ldap.sh"]
    environment:
      KC_SERVER_URL: http://keycloak:8080
      KC_REALM: energuate
      KC_ADMIN: ${KC_ADMIN:-admin}
      KC_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?Defina KC_ADMIN_PASSWORD en .env}
      KC_GROUP_ROLE_MAP: ${KC_GROUP_ROLE_MAP:-}
      KC_LAB_USERS: ${KC_LAB_USERS:-false}
      KC_LAB_PASSWORD: ${KC_LAB_PASSWORD:-}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_CREDENTIAL: ${LDAP_BIND_CREDENTIAL:-}
      LDAP_USERS_DN: ${LDAP_USERS_DN:-}
      LDAP_USER_FILTER: ${LDAP_USER_FILTER:-}
      LDAP_GROUPS_DN: ${LDAP_GROUPS_DN:-}
      LDAP_GROUP_FILTER: ${LDAP_GROUP_FILTER:-}
      LDAP_GROUPS_RECURSIVE: ${LDAP_GROUPS_RECURSIVE:-false}
      LDAP_START_TLS: ${LDAP_START_TLS:-false}
      LDAP_ALLOW_INSECURE: ${LDAP_ALLOW_INSECURE:-false}
      LDAP_CONNECTION_TIMEOUT: ${LDAP_CONNECTION_TIMEOUT:-10000}
      LDAP_READ_TIMEOUT: ${LDAP_READ_TIMEOUT:-30000}
      LDAP_SEARCH_SCOPE: ${LDAP_SEARCH_SCOPE:-subtree}
      LDAP_PAGINATION: ${LDAP_PAGINATION:-true}
      LDAP_BATCH_SIZE: ${LDAP_BATCH_SIZE:-500}
      LDAP_FULL_SYNC_PERIOD: ${LDAP_FULL_SYNC_PERIOD:-86400}
      LDAP_CHANGED_SYNC_PERIOD: ${LDAP_CHANGED_SYNC_PERIOD:-3600}
      LDAP_SYNC_USERS_ON_START: ${LDAP_SYNC_USERS_ON_START:-false}
    volumes:
      - ./keycloak/configure-ldap.sh:/opt/keycloak/scripts/configure-ldap.sh:ro
    depends_on:
      keycloak: {condition: service_healthy}

  # --- Adjuntos (MinIO, compatible S3) ------------------------------------------
  # La imagen oficial minio/minio dejó de publicarse en Docker Hub; se usa la
  # compilación de Chainguard (variante -dev: incluye sh/wget para healthcheck),
  # fijada por digest. Puede sustituirse con MINIO_IMAGE / MINIO_MC_IMAGE.
  minio:
    <<: *common
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest-dev@sha256:1c7e1d77097544ec74f9dc7a8f65d1297e9e8a04365038de077b9420913847db}
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Defina MINIO_ROOT_USER en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Defina MINIO_ROOT_PASSWORD en .env}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    volumes: [minio_data:/data]
    # 9000 = API S3 (descargas con URL prefirmada desde el navegador), 9001 = consola.
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio-init:
    image: ${MINIO_MC_IMAGE:-cgr.dev/chainguard/minio-client:latest-dev@sha256:f7f15a061d9a608d4ac2ca2bc0d9041bfa94de656f13ff2f4a80f57acad51c3b}
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    environment:
      HOME: /tmp
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Defina MINIO_ROOT_USER en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Defina MINIO_ROOT_PASSWORD en .env}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Defina S3_ACCESS_KEY en .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Defina S3_SECRET_KEY en .env}
      S3_BUCKET: ${S3_BUCKET:-servicedesk-attachments}
    # Crea el bucket privado y una cuenta de servicio limitada a ese bucket
    # (la API nunca usa las credenciales root de MinIO). Idempotente.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        tries=0
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
          tries=$$((tries + 1))
          [ "$$tries" -lt 30 ] || { echo "minio-init: MinIO no responde" >&2; exit 1; }
          sleep 2
        done
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set none "local/$$S3_BUCKET"
        cat > /tmp/servicedesk-policy.json <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            {"Effect": "Allow", "Action": ["s3:GetBucketLocation", "s3:ListBucket", "s3:ListBucketMultipartUploads"],
             "Resource": ["arn:aws:s3:::$$S3_BUCKET"]},
            {"Effect": "Allow", "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"],
             "Resource": ["arn:aws:s3:::$$S3_BUCKET/*"]}
          ]
        }
        EOF
        mc admin policy create local servicedesk-app /tmp/servicedesk-policy.json
        mc admin user add local "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        if ! mc admin policy entities local --user "$$S3_ACCESS_KEY" | grep -q servicedesk-app; then
          mc admin policy attach local servicedesk-app --user "$$S3_ACCESS_KEY"
        fi
        echo "minio-init: bucket '$$S3_BUCKET' privado y usuario de servicio listos"
    depends_on:
      minio: {condition: service_healthy}

  # --- Aplicación -------------------------------------------------------------
  api:
    <<: *common
    build: ./backend
    image: energuate-service-desk/backend:local
    # CMD por defecto de la imagen ("api"): alembic upgrade head -> seeds -> uvicorn.
    environment:
      <<: *backend-env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      keycloak: {condition: service_started}
      minio-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  worker:
    <<: *common
    build: ./backend
    image: energuate-service-desk/backend:local
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=INFO"]
    environment:
      <<: *backend-env
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      api: {condition: service_healthy}

  beat:
    <<: *common
    build: ./backend
    image: energuate-service-desk/backend:local
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=INFO"]
    environment:
      <<: *backend-env
      CELERY_BEAT_SCHEDULE_FILE: /tmp/celerybeat-schedule
    depends_on:
      redis: {condition: service_healthy}
      api: {condition: service_healthy}

  web:
    <<: *common
    image: energuate-service-desk/web:local
    build:
      context: ./frontend
      # NEXT_PUBLIC_* se incrustan en el bundle en tiempo de build.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:-oidc}
        NEXT_PUBLIC_KEYCLOAK_URL: ${NEXT_PUBLIC_KEYCLOAK_URL:-http://localhost:8081}
        NEXT_PUBLIC_KEYCLOAK_REALM: ${NEXT_PUBLIC_KEYCLOAK_REALM:-energuate}
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID:-servicedesk-web}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  db_data:
  redis_data:
  kc_data:
  minio_data:

# Tema de login "energuate" para Keycloak 26.1.
# Hereda plantillas y comportamiento de keycloak.v2 (PatternFly 5) y solo cambia la apariencia
# con la paleta del portal (app/globals.css): barra lateral azul marino, botón primario y marca ESD.
parent=keycloak.v2
import=common/keycloak

# css/styles.css se resuelve en el tema padre; energuate.css va después para sobrescribirlo.
styles=css/styles.css css/energuate.css

# El portal solo tiene modo claro: se desactiva el modo oscuro automático de keycloak.v2.
darkMode=false

# Energuate Service Desk — PRODUCCIÓN
#
# Archivo COMPLETO e independiente (no es un overlay de docker-compose.yml).
#
#   cp .env.production.example .env      # en el servidor; editar TODOS los replace-...
#   docker compose -f docker-compose.prod.yml config -q
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Guía completa: docs/DEPLOYMENT.md y docs/OPERATIONS.md.
#
# Topología (un único dominio, APP_DOMAIN, servido por Caddy con TLS):
#   https://APP_DOMAIN/            -> web (Next.js)
#   https://APP_DOMAIN/api/*       -> api (se elimina el prefijo /api)
#   https://APP_DOMAIN/ws          -> api (WebSocket)
#   https://APP_DOMAIN/auth/*      -> keycloak (KC_HTTP_RELATIVE_PATH=/auth)
#   MinIO no se publica: la API sube y sirve los adjuntos tras verificar permisos.
#
# Garantías de este archivo:
#   - Solo Caddy publica puertos (80/443). Ningún otro servicio es accesible
#     desde fuera del host.
#   - AUTH_MODE=oidc, SEED_DEMO=false y KC_LAB_USERS=false están fijados aquí y
#     no se pueden cambiar desde .env.
#   - Keycloak en modo "start" (producción) detrás del proxy.
#   - Redes separadas: "edge" (proxy y servicios publicados), "backend"
#     (interna, sin salida a Internet) y "egress" (salida a AD/SMTP).
#   - "preflight" (deploy/preflight.sh) aborta el arranque si alguna credencial
#     conserva el valor de la plantilla (replace-...), es trivial o demasiado corta.
#   - Contenedores endurecidos: cap_drop ALL (Caddy solo NET_BIND_SERVICE) y
#     sistema de archivos de solo lectura en api/worker/beat/web (tmpfs en /tmp).

name: ${COMPOSE_PROJECT_NAME:-energuate-sd}

x-common: &common
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: {max-size: "${LOG_MAX_SIZE:-20m}", max-file: "${LOG_MAX_FILE:-5}"}

# Servicios sin necesidad de capacidades de Linux y con raíz de solo lectura.
x-hardened: &hardened
  cap_drop: [ALL]
  read_only: true

# Todo servicio con estado o expuesto arranca después de la comprobación previa.
x-after-preflight: &after-preflight
  preflight: {condition: service_completed_successfully}

x-backend-env: &backend-env
  ENVIRONMENT: production
  AUTH_MODE: oidc
  SEED_DEMO: "false"
  # Ejemplos de flujos (política «Cambios» con etapa CAB global y reglas): desactivados
  # por defecto en producción; solo se siembran una vez aunque se activen.
  SEED_FLOWS_EXAMPLES: ${SEED_FLOWS_EXAMPLES:-false}
  # Enlaces de los correos de notificación.
  APP_PUBLIC_URL: https://${APP_DOMAIN:?Defina APP_DOMAIN}
  # /docs, /redoc y /openapi.json: desactivados en producción salvo API_DOCS=true.
  API_DOCS: ${API_DOCS:-false}
  OIDC_MISSING_GROUPS_AS_EMPTY: ${OIDC_MISSING_GROUPS_AS_EMPTY:-true}
  DATABASE_URL: postgresql+psycopg://servicedesk:${DB_PASSWORD:?Defina DB_PASSWORD}@db:5432/servicedesk
  REDIS_URL: redis://:${REDIS_PASSWORD:?Defina REDIS_PASSWORD}@redis:6379/0
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
  # Solo se confía en X-Forwarded-* que llegan desde la IP fija de Caddy.
  FORWARDED_ALLOW_IPS: ${CADDY_EDGE_IP:-10.250.250.10}
  API_ROOT_PATH: /api
  CELERY_BEAT_SCHEDULE_FILE: /tmp/celerybeat-schedule
  CORS_ORIGINS: https://${APP_DOMAIN:?Defina APP_DOMAIN}
  OIDC_ISSUER: https://${APP_DOMAIN}/auth/realms/${KC_REALM:-energuate}
  OIDC_JWKS_URL: http://keycloak:8080/auth/realms/${KC_REALM:-energuate}/protocol/openid-connect/certs
  OIDC_AUDIENCE: servicedesk-api
  SEED_TEAM_GROUPS: ${SEED_TEAM_GROUPS:-Telecomunicaciones:GG-SD-Telecomunicaciones,Seguridad de Redes:GG-SD-SeguridadRedes,Ciberseguridad / SOC:GG-SD-SOC,Riesgo y Cumplimiento:GG-SD-Riesgo,Proyectos TI:GG-SD-ProyectosTI,General:GG-SD-General}
  TZ_BUSINESS: ${TZ_BUSINESS:-America/Guatemala}
  S3_ENDPOINT: http://minio:9000
  # Sin uso para adjuntos (la API hace de proxy); se mantiene por compatibilidad.
  S3_PUBLIC_ENDPOINT: https://${APP_DOMAIN}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Defina S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?Defina S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET:-servicedesk-attachments}
  S3_REGION: ${S3_REGION:-us-east-1}
  MAX_ATTACHMENT_MB: ${MAX_ATTACHMENT_MB:-20}
  ATTACHMENT_PURGE_DAYS: ${ATTACHMENT_PURGE_DAYS:-30}
  # Anti-abuso (ver docs/SECURITY.md).
  REQUESTER_MAX_PRIORITY: ${REQUESTER_MAX_PRIORITY-high}
  TICKETS_PER_USER_HOUR: ${TICKETS_PER_USER_HOUR:-30}
  ATTACHMENT_USER_DAILY_MB: ${ATTACHMENT_USER_DAILY_MB:-500}
  ATTACHMENT_USER_DAILY_COUNT: ${ATTACHMENT_USER_DAILY_COUNT:-100}
  ACCOUNT_STALE_DAYS: ${ACCOUNT_STALE_DAYS:-45}
  OIDC_JWKS_MIN_REFRESH_SECONDS: ${OIDC_JWKS_MIN_REFRESH_SECONDS:-60}
  WS_MAX_CONNECTIONS_PER_USER: ${WS_MAX_CONNECTIONS_PER_USER:-8}
  WS_CLIENT_MESSAGES_PER_MINUTE: ${WS_CLIENT_MESSAGES_PER_MINUTE:-60}
  WS_MAX_MESSAGE_BYTES: ${WS_MAX_MESSAGE_BYTES:-16384}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:?Defina SMTP_FROM}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}

services:
  # --- Comprobación previa (one-shot, sin red) -----------------------------------
  preflight:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: "no"
    network_mode: none
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    user: "65534:65534"
    entrypoint: ["/bin/sh", "/preflight.sh"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-}
      TLS_MODE: ${TLS_MODE:-acme}
      ACME_EMAIL: ${ACME_EMAIL:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-}
      KC_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_CREDENTIAL: ${LDAP_BIND_CREDENTIAL:-}
      LDAP_USERS_DN: ${LDAP_USERS_DN:-}
      LDAP_GROUPS_DN: ${LDAP_GROUPS_DN:-}
      PREFLIGHT_MIN_SECRET_LENGTH: ${PREFLIGHT_MIN_SECRET_LENGTH:-16}
    volumes:
      - ./deploy/preflight.sh:/preflight.sh:ro
    logging:
      driver: json-file
      options: {max-size: "1m", max-file: "2"}

  # --- Proxy inverso con TLS (único servicio con puertos publicados) ----------
  caddy:
    <<: *common
    image: ${CADDY_IMAGE:-caddy:2.10-alpine}
    # La imagen oficial corre como root: se le quitan todas las capacidades salvo
    # la necesaria para escuchar en 80/443.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      TLS_MODE: ${TLS_MODE:-acme}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ADMIN_ALLOWED_CIDRS: ${ADMIN_ALLOWED_CIDRS:-127.0.0.1/32}
      MAX_REQUEST_BODY: ${MAX_REQUEST_BODY:-30MB}
    ports:
      - "${PUBLIC_BIND_IP:-0.0.0.0}:80:80"
      - "${PUBLIC_BIND_IP:-0.0.0.0}:443:443"
      - "${PUBLIC_BIND_IP:-0.0.0.0}:443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados corporativos (TLS_MODE=files): tls.crt (cadena completa) y tls.key.
      - ${TLS_CERTS_DIR:-./deploy/certs}:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        ipv4_address: ${CADDY_EDGE_IP:-10.250.250.10}
    # service_started: Caddy sirve 502 mientras un servicio se reinicia, en vez
    # de dejar caído todo el dominio.
    depends_on:
      <<: *after-preflight
      web: {condition: service_started}
      api: {condition: service_started}
      keycloak: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8088/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 256M}

  # --- Datos de la aplicación -------------------------------------------------
  db:
    <<: *common
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: servicedesk
      POSTGRES_USER: servicedesk
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [db_data:/var/lib/postgresql/data]
    networks: [backend]
    depends_on: *after-preflight
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicedesk -d servicedesk"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits: {cpus: "${DB_CPUS:-2.0}", memory: "${DB_MEMORY:-2G}"}

  redis:
    <<: *common
    image: ${REDIS_IMAGE:-redis:7-alpine}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD" --maxmemory-policy noeviction
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes: [redis_data:/data]
    networks: [backend]
    depends_on: *after-preflight
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: {cpus: "1.0", memory: "${REDIS_MEMORY:-512M}"}

  # --- Identidad -------------------------------------------------------------
  keycloak-db:
    <<: *common
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?Defina KC_DB_PASSWORD}
    volumes: [kc_data:/var/lib/postgresql/data]
    networks: [backend]
    depends_on: *after-preflight
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1G}

  keycloak:
    <<: *common
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.1}
    # Modo producción. --import-realm solo crea el realm si aún no existe.
    command: ["start", "--import-realm"]
    cap_drop: [ALL]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?Defina KC_ADMIN_PASSWORD}
      # Detrás de Caddy: HTTP interno, URL pública HTTPS bajo /auth.
      KC_HOSTNAME: https://${APP_DOMAIN}/auth
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_TRUSTED_ADDRESSES: ${CADDY_EDGE_IP:-10.250.250.10}
      # Health y métricas solo en el puerto de gestión 9000 (no publicado ni proxificado).
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /
      KC_TRUSTSTORE_PATHS: /opt/keycloak/conf/truststores
      KC_LOG_LEVEL: ${KC_LOG_LEVEL:-info}
      KC_LOG_CONSOLE_OUTPUT: ${KC_LOG_FORMAT:-default}
      JAVA_OPTS_KC_HEAP: ${KC_HEAP_OPTS:--XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=50}
    volumes:
      - ./keycloak/realm-energuate.json:/opt/keycloak/data/import/realm-energuate.json:ro
      - ${KC_TRUSTSTORE_DIR:-./keycloak/truststore}:/opt/keycloak/conf/truststores:ro
    networks: [edge, backend, egress]
    depends_on:
      <<: *after-preflight
      keycloak-db: {condition: service_healthy}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 120s
    deploy:
      resources:
        limits: {cpus: "${KC_CPUS:-2.0}", memory: "${KC_MEMORY:-1536M}"}

  keycloak-config:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.1}
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    entrypoint: ["/bin/sh", "/opt/keycloak/scripts/configure-ldap.sh"]
    environment:
      KC_SERVER_URL: http://keycloak:8080/auth
      KC_REALM: ${KC_REALM:-energuate}
      KC_ADMIN: ${KC_ADMIN:-admin}
      KC_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_GROUP_ROLE_MAP: ${KC_GROUP_ROLE_MAP:-GG-SD-Admins:admin,GG-SD-Agentes:agent,GG-SD-Aprobadores:approver}
      KC_WEB_URLS: https://${APP_DOMAIN}
      SEED_TEAM_GROUPS: ${SEED_TEAM_GROUPS:-Telecomunicaciones:GG-SD-Telecomunicaciones,Seguridad de Redes:GG-SD-SeguridadRedes,Ciberseguridad / SOC:GG-SD-SOC,Riesgo y Cumplimiento:GG-SD-Riesgo,Proyectos TI:GG-SD-ProyectosTI,General:GG-SD-General}
      # Fijo en producción: los usuarios de laboratorio se deshabilitan si existen.
      KC_LAB_USERS: "false"
      LDAP_URL: ${LDAP_URL:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_CREDENTIAL: ${LDAP_BIND_CREDENTIAL:-}
      LDAP_USERS_DN: ${LDAP_USERS_DN:-}
      LDAP_USER_FILTER: ${LDAP_USER_FILTER:-}
      LDAP_GROUPS_DN: ${LDAP_GROUPS_DN:-}
      LDAP_GROUP_FILTER: ${LDAP_GROUP_FILTER:-}
      LDAP_GROUPS_RECURSIVE: ${LDAP_GROUPS_RECURSIVE:-false}
      LDAP_START_TLS: ${LDAP_START_TLS:-false}
      # Fijo en producción: nunca se permite LDAP sin cifrar.
      LDAP_ALLOW_INSECURE: "false"
      LDAP_CONNECTION_TIMEOUT: ${LDAP_CONNECTION_TIMEOUT:-10000}
      LDAP_READ_TIMEOUT: ${LDAP_READ_TIMEOUT:-30000}
      LDAP_SEARCH_SCOPE: ${LDAP_SEARCH_SCOPE:-subtree}
      LDAP_PAGINATION: ${LDAP_PAGINATION:-true}
      LDAP_BATCH_SIZE: ${LDAP_BATCH_SIZE:-500}
      LDAP_FULL_SYNC_PERIOD: ${LDAP_FULL_SYNC_PERIOD:-86400}
      LDAP_CHANGED_SYNC_PERIOD: ${LDAP_CHANGED_SYNC_PERIOD:-3600}
      LDAP_SYNC_USERS_ON_START: ${LDAP_SYNC_USERS_ON_START:-false}
    volumes:
      - ./keycloak/configure-ldap.sh:/opt/keycloak/scripts/configure-ldap.sh:ro
    networks: [backend]
    depends_on:
      keycloak: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # --- Adjuntos (MinIO, compatible S3) ------------------------------------------
  minio:
    <<: *common
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest-dev@sha256:1c7e1d77097544ec74f9dc7a8f65d1297e9e8a04365038de077b9420913847db}
    command: ["server", "/data", "--address", ":9000"]
    cap_drop: [ALL]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Defina MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Defina MINIO_ROOT_PASSWORD}
      # Consola web desactivada en producción.
      MINIO_BROWSER: "off"
    volumes: [minio_data:/data]
    # Solo red interna: el navegador nunca accede a MinIO.
    networks: [backend]
    depends_on: *after-preflight
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits: {cpus: "1.0", memory: "${MINIO_MEMORY:-1G}"}

  minio-init:
    image: ${MINIO_MC_IMAGE:-cgr.dev/chainguard/minio-client:latest-dev@sha256:f7f15a061d9a608d4ac2ca2bc0d9041bfa94de656f13ff2f4a80f57acad51c3b}
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      HOME: /tmp
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-servicedesk-attachments}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        tries=0
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
          tries=$$((tries + 1))
          [ "$$tries" -lt 30 ] || { echo "minio-init: MinIO no responde" >&2; exit 1; }
          sleep 2
        done
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set none "local/$$S3_BUCKET"
        cat > /tmp/servicedesk-policy.json <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            {"Effect": "Allow", "Action": ["s3:GetBucketLocation", "s3:ListBucket", "s3:ListBucketMultipartUploads"],
             "Resource": ["arn:aws:s3:::$$S3_BUCKET"]},
            {"Effect": "Allow", "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"],
             "Resource": ["arn:aws:s3:::$$S3_BUCKET/*"]}
          ]
        }
        EOF
        mc admin policy create local servicedesk-app /tmp/servicedesk-policy.json
        mc admin user add local "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        if ! mc admin policy entities local --user "$$S3_ACCESS_KEY" | grep -q servicedesk-app; then
          mc admin policy attach local servicedesk-app --user "$$S3_ACCESS_KEY"
        fi
        echo "minio-init: bucket '$$S3_BUCKET' privado y usuario de servicio listos"
    networks: [backend]
    depends_on:
      minio: {condition: service_healthy}

  # --- Aplicación -------------------------------------------------------------
  api:
    <<: [*common, *hardened]
    build: ./backend
    image: ${BACKEND_IMAGE:-energuate-service-desk/backend:prod}
    # Las subidas multipart grandes se vuelcan a /tmp (tmpfs: cuenta en la memoria).
    tmpfs: ["/tmp:size=256m,mode=1777"]
    # CMD por defecto de la imagen ("api"): alembic upgrade head -> seeds -> uvicorn.
    environment:
      <<: *backend-env
    networks: [edge, backend, egress]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      keycloak: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
    deploy:
      resources:
        limits: {cpus: "${API_CPUS:-2.0}", memory: "${API_MEMORY:-1G}"}

  worker:
    <<: [*common, *hardened]
    image: ${BACKEND_IMAGE:-energuate-service-desk/backend:prod}
    command:
      - celery
      - -A
      - app.tasks.celery_app
      - worker
      - --loglevel=${CELERY_LOG_LEVEL:-info}
      - --concurrency=${CELERY_CONCURRENCY:-4}
    tmpfs: ["/tmp:size=64m,mode=1777"]
    environment:
      <<: *backend-env
    networks: [backend, egress]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits: {cpus: "${WORKER_CPUS:-1.5}", memory: "${WORKER_MEMORY:-1G}"}

  beat:
    <<: [*common, *hardened]
    image: ${BACKEND_IMAGE:-energuate-service-desk/backend:prod}
    # Una sola instancia de beat: nunca escalar este servicio.
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=${CELERY_LOG_LEVEL:-info}"]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    environment:
      <<: *backend-env
    networks: [backend]
    depends_on:
      redis: {condition: service_healthy}
      api: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 384M}

  web:
    <<: [*common, *hardened]
    init: true
    image: ${WEB_IMAGE:-energuate-service-desk/web:prod}
    # Next.js escribe su caché en .next/cache; nada más es escribible.
    tmpfs:
      - "/tmp:size=64m,mode=1777"
      - "/app/.next/cache:size=128m,uid=1000,gid=1000"
    build:
      context: ./frontend
      # NEXT_PUBLIC_* se incrustan en el bundle en tiempo de build: un cambio de
      # APP_DOMAIN exige reconstruir esta imagen.
      args:
        NEXT_PUBLIC_API_URL: https://${APP_DOMAIN}/api
        NEXT_PUBLIC_WS_URL: wss://${APP_DOMAIN}/ws
        NEXT_PUBLIC_AUTH_MODE: oidc
        NEXT_PUBLIC_KEYCLOAK_URL: https://${APP_DOMAIN}/auth
        NEXT_PUBLIC_KEYCLOAK_REALM: ${KC_REALM:-energuate}
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: servicedesk-web
        NEXT_PUBLIC_CSP_EXTRA_SOURCES: ${NEXT_PUBLIC_CSP_EXTRA_SOURCES:-}
    networks: [edge]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits: {cpus: "1.0", memory: "${WEB_MEMORY:-512M}"}

networks:
  # Proxy y servicios que Caddy publica. Subred fija para conocer la IP de Caddy
  # (cabeceras X-Forwarded-* de confianza). Cambie EDGE_SUBNET/CADDY_EDGE_IP si
  # chocan con rutas de la red corporativa.
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-10.250.250.0/24}
  # Datos: sin salida a Internet ni a la LAN.
  backend:
    driver: bridge
    internal: true
  # Salida controlada: AD (Keycloak) y SMTP (worker/api).
  egress:
    driver: bridge

volumes:
  db_data:
  redis_data:
  kc_data:
  minio_data:
  caddy_data:
  caddy_config:
